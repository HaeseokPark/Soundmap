# ############################################################################
# 주의: 이 파일을 서버에 그대로 덮어쓰지 마세요.
#
# 서버의 /etc/nginx/sites-available/soundmap 은 certbot 이 HTTPS 를 붙이면서
# 고쳐 놓은 상태입니다. 443 리스너, 인증서 경로, 80 → 443 리다이렉트가 그쪽에만
# 있습니다. 이 파일에는 없습니다.
#
# 그대로 복사하면 nginx -t 는 통과하지만 443 을 듣지 않게 되어 사이트가
# HTTPS 로 접속되지 않습니다. (2026-09-08 에 실제로 그렇게 만들었습니다.)
#
# 처음 설치할 때만 이 파일을 쓰고, 그 뒤에는 서버 파일을 직접 고치세요:
#
#   sudo cp -a /etc/nginx/sites-available/soundmap{,.bak-$(date +%F-%H%M%S)}
#   sudo nano /etc/nginx/sites-available/soundmap
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ss -lntp | grep :443      # 443 을 계속 듣는지 반드시 확인
# ############################################################################

# SoundMap nginx 설정
#
# 프론트(정적 파일)와 백엔드(API·WebSocket)를 같은 도메인에서 서비스한다.
# 이렇게 하면 CORS 설정이 아예 필요 없고, WebSocket 주소도 현재 주소에서 유도된다.
#
# 설치:
#   sudo cp deploy/nginx-soundmap.conf /etc/nginx/sites-available/soundmap
#   sudo ln -s /etc/nginx/sites-available/soundmap /etc/nginx/sites-enabled/soundmap
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 파일은 HTTP(80) 상태의 초기 설정이다. certbot 을 실행하면 443 서버 블록과
# HTTP→HTTPS 리다이렉트를 자동으로 추가해 준다.

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ 본인 도메인으로 바꾸세요 ↓↓↓
    server_name soundmap.example.com;

    # 업로드/요청 본문 크기. 메시지가 최대 1000자라 넉넉하다.
    client_max_body_size 1m;

    # 앨범아트가 외부(mzstatic.com)에서 오므로 참조자 정보를 줄인다.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---------- 프론트엔드 (React 빌드 결과) ----------
    root /var/www/soundmap;
    index index.html;

    location / {
        # SPA 라우팅. /chats/3 같은 주소로 새로고침해도 index.html 을 준다.
        # 이게 없으면 새로고침할 때마다 404 가 난다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx 기본 mime.types 에는 .webmanifest 가 없어 octet-stream 으로 나간다.
    # 홈 화면 추가(PWA)를 인식시키려면 제 타입으로 내려줘야 한다.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # ---------- 백엔드 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- WebSocket (STOMP) ----------
    #
    # Upgrade / Connection 헤더를 넘기지 않으면 핸드셰이크가 조용히 실패해서
    # 채팅만 안 되는 상태가 된다. 배포에서 가장 자주 걸리는 지점이다.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채팅은 조용한 시간이 길다. 기본 60초로 두면 계속 끊겼다 붙는다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
